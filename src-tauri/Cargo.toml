[package]
name = "image-gen-kit"
version = "0.1.0"
description = "Desktop image generation workbench"
authors = ["Image Gen Kit Contributors"]
edition = "2021"

[lib]
name = "image_gen_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
ureq = { version = "2.12", default-features = true }
tauri-plugin-notification = "2"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
